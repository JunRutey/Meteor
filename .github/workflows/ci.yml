name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap structural job: runs before anything compiles and enforces the
  # dependency direction from the Meteor archive (R1) without a Gradle run.
  module-graph:
    name: Module graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify module dependency graph
        run: bash tools/check-module-graph.sh

  build:
    name: Build / Test / Lint
    runs-on: ubuntu-latest
    needs: module-graph
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No gradle wrapper in this repo by design: local Gradle execution is
      # forbidden (see AGENTS.md). CI pins the Gradle version instead.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meteor-failure-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
