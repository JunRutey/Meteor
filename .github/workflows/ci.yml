name: CI

on:
  push:
    branches: [ main ]
    # Docs-only changes never change the APK; skip the expensive jobs.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap structural job: runs before anything compiles and enforces the
  # dependency direction from the Meteor archive (R1) without a Gradle run.
  module-graph:
    name: Module graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify module dependency graph
        run: bash tools/check-module-graph.sh

  build:
    name: Build / Test / Lint
    runs-on: ubuntu-latest
    needs: module-graph
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No gradle wrapper in this repo by design: local Gradle execution is
      # forbidden (see AGENTS.md). CI pins the Gradle version instead.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # One invocation instead of four separate ones: the validation tasks
      # share the same configuration and daemon round trip.
      #
      # :app:assembleRelease is part of this run on purpose. app/build.gradle.kts
      # enables R8 + resource shrinking for release, and without building that
      # variant here the shrinker rules were only ever exercised for the first
      # time on a release tag — a broken rule would have surfaced as a failed
      # publish rather than a failed PR. The release build is unsigned here
      # (SIGNING_* is unset), which is fine: R8 runs regardless.
      - name: Build, test and lint
        run: >-
          gradle :app:assembleDebug :app:assembleRelease testDebugUnitTest
          :app:lintDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: meteor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: meteor-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.txt
          if-no-files-found: ignore
          retention-days: 14
