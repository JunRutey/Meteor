name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap structural job: runs before anything compiles and enforces the
  # dependency direction from the Meteor archive (R1) without a Gradle run.
  module-graph:
    name: Module graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify module dependency graph
        run: bash tools/check-module-graph.sh

  build:
    name: Build / Test / Lint
    runs-on: ubuntu-latest
    needs: module-graph
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No gradle wrapper in this repo by design: local Gradle execution is
      # forbidden (see AGENTS.md). CI pins the Gradle version instead.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: meteor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: meteor-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.txt
          if-no-files-found: ignore
          retention-days: 14

  # Archive R3: "a feature module must be removable". This actually drops a
  # module from the build and proves the rest still compiles.
  pluggability:
    name: Pluggability (no core-index)
    runs-on: ubuntu-latest
    needs: module-graph
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Assemble without :core-index
        run: gradle :app:assembleDebug -Pmeteor.excludeModules=core-index --stacktrace --no-daemon
