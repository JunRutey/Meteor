name: CI

on:
  push:
    branches: [ main ]
    # Docs-only changes never change the APK; skip the expensive jobs.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap structural job: runs before anything compiles and enforces the
  # dependency direction from the Meteor archive (R1) without a Gradle run.
  module-graph:
    name: Module graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify module dependency graph
        run: bash tools/check-module-graph.sh

  build:
    name: Build / Test / Lint / Pluggability
    runs-on: ubuntu-latest
    needs: module-graph
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No gradle wrapper in this repo by design: local Gradle execution is
      # forbidden (see AGENTS.md). CI pins the Gradle version instead.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # One invocation instead of four separate ones: the validation tasks
      # share the same configuration and daemon round trip. R8 only runs in
      # the Release workflow (it builds the release variant); CI stays on debug.
      - name: Build, test and lint
        run: gradle :app:assembleDebug testDebugUnitTest :app:lintDebug --stacktrace --no-daemon

      # Upload before the pluggability builds below overwrite the debug APK
      # output directory with their own variants.
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: meteor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # Archive R3: "a feature module must be removable". This actually drops a
      # module from the build and proves the rest still compiles.
      - name: Assemble without :core-index
        run: gradle :app:assembleDebug -Pmeteor.excludeModules=core-index --stacktrace --no-daemon

      - name: Assemble without :core-notify
        run: gradle :app:assembleDebug -Pmeteor.excludeModules=core-notify --stacktrace --no-daemon

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: meteor-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.txt
          if-no-files-found: ignore
          retention-days: 14

  # The lunar conversion reads Android's ICU calendar data, which JVM unit tests
  # do not have. A real emulator is required, so it gets its own job with a hard
  # timeout: a flaky boot can never hide a build or lint failure.
  instrumentation:
    name: Instrumentation tests (ICU)
    runs-on: ubuntu-latest
    needs: module-graph
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # KVM makes the x86_64 emulator usable on a hosted runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon
