name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Verify signing secrets are present
        run: |
          for name in METEOR_KEYSTORE_BASE64 METEOR_KEYSTORE_PASSWORD METEOR_KEY_ALIAS METEOR_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          echo "All signing secrets present."
        env:
          METEOR_KEYSTORE_BASE64: ${{ secrets.METEOR_KEYSTORE_BASE64 }}
          METEOR_KEYSTORE_PASSWORD: ${{ secrets.METEOR_KEYSTORE_PASSWORD }}
          METEOR_KEY_ALIAS: ${{ secrets.METEOR_KEY_ALIAS }}
          METEOR_KEY_PASSWORD: ${{ secrets.METEOR_KEY_PASSWORD }}

      - name: Decode keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$METEOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/meteor.jks"
          echo "METEOR_KEYSTORE_PATH=$RUNNER_TEMP/keystore/meteor.jks" >> "$GITHUB_ENV"
        env:
          METEOR_KEYSTORE_BASE64: ${{ secrets.METEOR_KEYSTORE_BASE64 }}

      - name: Build signed release
        run: gradle :app:assembleRelease --stacktrace --no-daemon
        env:
          METEOR_KEYSTORE_PASSWORD: ${{ secrets.METEOR_KEYSTORE_PASSWORD }}
          METEOR_KEY_ALIAS: ${{ secrets.METEOR_KEY_ALIAS }}
          METEOR_KEY_PASSWORD: ${{ secrets.METEOR_KEY_PASSWORD }}

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
