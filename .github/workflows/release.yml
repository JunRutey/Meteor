name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild and publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # Secret names are shared by every app I ship; the material for this one
      # lives under meteor/ in the private repo JunRutey/android-signing-keys.
      - name: Verify signing secrets are present
        run: |
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          echo "All signing secrets present."
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Decode keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/meteor-release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/keystore/meteor-release.p12" >> "$GITHUB_ENV"
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: Build signed release
        run: gradle :app:assembleRelease --stacktrace --no-daemon
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Verify signer fingerprint
        run: |
          set -euo pipefail
          # SHA-256 of Meteor's release certificate. Keep in sync with
          # JunRutey/android-signing-keys/meteor/README.md.
          EXPECTED="1EDDA2E5D7B596FF9E27510E271526A02CD08B2EB15EA3D87BB91F4B7B441CF6"

          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then echo "::error::no release APK produced"; exit 1; fi

          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt

          # apksigner prints bare hex, and prefixes the line with "V2 Signer:"
          # when the APK carries a v2-only signature (minSdk 26 makes that normal).
          ACTUAL="$(grep -i 'certificate SHA-256 digest:' signer.txt \
            | head -n1 | sed 's/.*digest: *//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the Meteor release key"
            exit 1
          fi
          echo "Signer matches the Meteor release key."

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          ls -l dist

      # Release notes are written by hand in Chinese under docs/releases/<tag>.md.
      # A missing file fails the job on purpose: GitHub's auto-generated notes are
      # English pull-request lists and are not acceptable here.
      - name: Read release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          FILE="docs/releases/${TAG}.md"
          if [ ! -f "$FILE" ]; then
            echo "::error::缺少发布说明：$FILE（必须用中文手写）"
            exit 1
          fi
          {
            echo "body<<__METEOR_NOTES__"
            cat "$FILE"
            echo "__METEOR_NOTES__"
          } >> "$GITHUB_OUTPUT"
          echo "用 $FILE 作为发布说明"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the pushed tag; on manual runs it is required input.
          tag_name: ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          files: dist/*.apk
          fail_on_unmatched_files: true
