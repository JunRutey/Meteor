# JVM
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# --- Meteor module trimming (legacy: R3 retired, unmaintained — see AGENTS.md §3) ---
# Comma separated Gradle module names to drop from the build, e.g.:
#   -Pmeteor.excludeModules=core-index,feature-ai
# Empty means "build everything". Kept for parity only: CI no longer verifies
# that any module can actually be dropped.
meteor.excludeModules=
